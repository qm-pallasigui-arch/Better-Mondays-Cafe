name: Description Guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches:
      - '**'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-pr-description:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure PR description exists
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = (pr.body || '').trim();
            const minLength = 30;
            const looksMissing = body.length < minLength || /^(n\/?a|none|tbd|same as title)$/i.test(body);

            if (!looksMissing) {
              core.info('PR description is present.');
              return;
            }

            const template = [
              '## Summary',
              'Describe the purpose of this PR.',
              '',
              '## Changes',
              '- List key code/behavior changes.',
              '',
              '## Testing',
              '- Describe how this was tested.'
            ].join('\n');

            const autoBody = [
              '⚠️ This description was auto-filled because the PR description was missing or too short.',
              '',
              template
            ].join('\n');

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: autoBody
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: 'I added a PR description template automatically because the current description was missing or too short. Please replace it with real details before merging.'
            });

            core.setFailed('PR description was missing or too short. A template was added automatically; please update it with real details.');

  validate-push-commit-descriptions:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure pushed commits have descriptive messages
        uses: actions/github-script@v7
        with:
          script: |
            const commits = context.payload.commits || [];
            const minLength = 20;
            const generic = /^(wip|update|updates|fix|fixes|changes?|temp|minor)(\s|$)/i;

            const invalid = commits
              .map(c => ({
                id: c.id?.slice(0, 7) || 'unknown',
                message: (c.message || '').trim()
              }))
              .filter(c => c.message.length < minLength || generic.test(c.message));

            if (invalid.length === 0) {
              core.info('All commit messages look descriptive.');
              return;
            }

            const details = invalid
              .map(c => `- ${c.id}: "${c.message || '<empty>'}"`)
              .join('\n');

            core.setFailed([
              'Some pushed commits have missing or non-descriptive messages.',
              '',
              details,
              '',
              'Use clear messages that explain the change intent (for example: "Add PR description guard workflow").'
            ].join('\n'));
